[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-pre-mortem-agent"
version = "0.1.0"
description = "Prospective-hindsight failure analysis for synthetic care plans: assume the plan already harmed the patient, name the failure, its earliest warning sign, and the one change that would have prevented it"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Amna Raheeba" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]
dashboard = ["streamlit>=1.36"]

[tool.setuptools.packages.find]
include = ["clinical_pre_mortem_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
